<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify your Rise &amp; Bake account</title></head>
<body style="margin:0;padding:24px;background:#faf7f0;color:#283c32;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" style="width:100%;max-width:520px;margin:0 auto;border-collapse:collapse;">
    <tr><td style="padding:28px;background:#ffffff;border:1px solid #e6e7dd;border-radius:16px;">
      <p style="margin:0 0 24px;font-size:22px;font-weight:bold;">Rise &amp; Bake</p>
      <h1 style="margin:0 0 16px;font-size:26px;line-height:1.25;">Welcome to your bakery</h1>
      <p style="font-size:16px;line-height:1.6;">Enter this six-digit code in Rise &amp; Bake to verify your email address:</p>
      <p style="margin:24px 0;padding:20px;background:#f1f5ec;border-radius:12px;text-align:center;font-family:monospace;font-size:32px;font-weight:bold;letter-spacing:5px;">{{ .Token }}</p>
      <p style="font-size:15px;line-height:1.6;">The code expires in 10 minutes. Keep it private.</p>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#657269;">If you did not request an account, you can ignore this email.</p>
    </td></tr>
  </table>
</body>
</html>
