workflows:
  prism-harbour-ios:
    name: Prism Harbour iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Verify IPA platform validator
        script: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test game rules
        script: swift test
      - name: Build and launch simulator
        script: bash scripts/build_simulator.sh
      - name: Build unsigned iPhone IPA
        script: bash scripts/build_device.sh
    artifacts:
      - artifacts/PrismHarbour-unsigned.ipa
      - artifacts/PrismHarbour-unsigned.ipa.sha256
      - artifacts/INSTALL.md
      - artifacts/*.png
      - artifacts/*.txt
      - artifacts/*.log
      - artifacts/*validation.json